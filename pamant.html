<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Științele Pământului - SciArhive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container" style="margin:0 auto; padding:0;">
            <a href="index.html" class="back-link">← Înapoi la portal</a>
            <h1>🌍 Olimpiada de Științele Pământului (OJSP)</h1>
        </div>
    </header>

    <div class="container">
        <div class="search-box">
            <div class="filter-group">
                <label for="filter-year">Anul</label>
                <select id="filter-year" onchange="filtreaza()">
                    <option value="toate">Selectează anul</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="filter-stage">Etapa</label>
                <select id="filter-stage" onchange="filtreaza()">
                    <option value="toate">Selectează etapa</option>
                    <option value="Judeteana">Etapa Județeană (OJSP)</option>
                </select>
            </div>
        </div>

        <div id="results" class="results-container"></div>
    </div>

    <script>
        //Baza de date
        const datePamant = [
            { an: "2025", etapa: "Judeteana", titlu: "Olimpiada de Științele Pământului - Etapa Județeană", linkSub: "OJSP_2025_S.pdf", linkBar: "OJSP_2025_B.pdf" },
            { an: "2024", etapa: "Judeteana", titlu: "Olimpiada de Științele Pământului - Etapa Județeană", linkSub: "OJSP_2024_S.pdf", linkBar: "OJSP_2024_B.pdf" }
        ];

        function filtreaza() {
            const an = document.getElementById('filter-year').value;
            const etapa = document.getElementById('filter-stage').value;
            const container = document.getElementById('results');

            // Menținem ecranul curat dacă nu s-a selectat nimic complet
            if (an === 'toate' && etapa === 'toate') {
                afiseazaMesajInitial();
                return;
            }

            container.innerHTML = '';

            const filtrate = datePamant.filter(item => {
                const matchAn = (an === 'toate' || item.an === an);
                const matchEtapa = (etapa === 'toate' || item.etapa === etapa);
                return matchAn && matchEtapa;
            });

            if(filtrate.length === 0) {
                container.innerHTML = '<div class="no-results"><h3>Niciun rezultat găsit</h3><p>Nu am găsit subiecte pentru selecția făcută.</p></div>';
                return;
            }

            filtrate.forEach(item => {
                container.innerHTML += `
                    <div class="document-card">
                        <div class="doc-info">
                            <h3>${item.titlu}</h3>
                            <div class="tags">
                                <span class="tag">Anul ${item.an}</span>
                                <span class="tag">Etapa Județeană</span>
                                <span class="tag">Liceu (IX-XI)</span>
                            </div>
                        </div>
                        <div class="doc-buttons">
                            <a href="${item.linkSub}" target="_blank" class="btn btn-subject">Subiect (PDF)</a>
                            <a href="${item.linkBar}" target="_blank" class="btn btn-scheme">Barem (PDF)</a>
                        </div>
                    </div>`;
            });
        }

        function afiseazaMesajInitial() {
            document.getElementById('results').innerHTML = `
                <div class="no-results" style="border: 1px dashed var(--primary-color); background-color: #f0f9ff;">
                    <h3 style="color: var(--primary-color); margin: 0 0 0.5rem 0;">🔍 Pune filtrele în acțiune!</h3>
                    <p style="margin: 0;">Alege anul și etapa din meniurile de mai sus pentru a vizualiza documentele.</p>
                </div>`;
        }

        // Inițializăm pagina cu ecranul curat
        afiseazaMesajInitial();
    </script>
</body>
</html>
